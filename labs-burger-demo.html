<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Labs Burger POS — Live Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#fff;height:100vh;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;outline:none;transition:transform .08s,opacity .1s}
button:active{transform:scale(.96)}
input{font-family:'Inter',sans-serif;outline:none;border:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.bebas{font-family:'Bebas Neue',cursive}
</style>
</head>
<body>
<div id="app" style="height:100vh;display:flex;flex-direction:column"></div>
<script>
const PRODUCTS = [
  {id:'p1',name:'Classic Burger',price:89,category:'Burgers',is_combo:false,is_available:true},
  {id:'p2',name:'Cheeseburger',price:99,category:'Burgers',is_combo:false,is_available:true},
  {id:'p3',name:'Double Patty',price:129,category:'Burgers',is_combo:false,is_available:true},
  {id:'p4',name:'Spicy Burger',price:109,category:'Burgers',is_combo:false,is_available:true},
  {id:'p5',name:'Classic Combo',price:149,category:'Combos',is_combo:true,is_available:true},
  {id:'p6',name:'Cheese Combo',price:169,category:'Combos',is_combo:true,is_available:true},
  {id:'p7',name:'Double Combo',price:199,category:'Combos',is_combo:true,is_available:true},
  {id:'p8',name:'Coke',price:39,category:'Drinks',is_combo:false,is_available:true},
  {id:'p9',name:'Iced Tea',price:35,category:'Drinks',is_combo:false,is_available:true},
  {id:'p10',name:'Bottled Water',price:25,category:'Drinks',is_combo:false,is_available:true},
  {id:'p11',name:'Fries',price:59,category:'Sides',is_combo:false,is_available:true},
  {id:'p12',name:'Onion Rings',price:69,category:'Sides',is_combo:false,is_available:true},
  {id:'p13',name:'Coleslaw',price:45,category:'Sides',is_combo:false,is_available:false},
]
const CATEGORIES = ['All','Burgers','Combos','Drinks','Sides']

let cart = []
let activeCategory = 'All'
let view = 'pos' // pos | payment | success
let payMethod = 'cash'
let amountStr = ''
let refNote = ''
let diningType = 'dine_in'
let lastOrder = null
let orderCount = 42
let flashProduct = null
let flashTimer = null

const getTotal = () => cart.reduce((s,i) => s + i.price * i.qty, 0)
const getCount = () => cart.reduce((s,i) => s + i.qty, 0)
const fmtPrice = (n) => `₱${Number(n).toLocaleString('en-PH',{minimumFractionDigits:2})}`

function addToCart(product) {
  const existing = cart.find(i => i.id === product.id)
  if (existing) { existing.qty++; } else { cart.push({...product, qty:1, notes:''}) }
  flashProduct = product.id
  if (flashTimer) clearTimeout(flashTimer)
  flashTimer = setTimeout(() => { flashProduct = null; render() }, 160)
  render()
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id)
  if (!item) return
  item.qty += delta
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id)
  render()
}

function clearCart() { cart = []; render() }

function handleNumpad(k) {
  if (k === '←') { amountStr = amountStr.slice(0,-1) }
  else if (k === '.' && amountStr.includes('.')) return
  else if (amountStr.length < 8) amountStr += k
  render()
}

function confirmPayment() {
  orderCount++
  lastOrder = {
    number: `LB-${String(orderCount).padStart(4,'0')}`,
    total: getTotal(),
    method: payMethod,
    change: payMethod==='cash' ? Math.max(0, parseFloat(amountStr||0) - getTotal()) : 0,
    items: [...cart],
    diningType
  }
  view = 'success'
  render()
}

function newOrder() {
  cart = []; amountStr = ''; refNote = ''; view = 'pos'; lastOrder = null
  render()
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  const app = document.getElementById('app')
  app.innerHTML = ''

  // Top bar
  const topBar = el('div', {style:`display:flex;align-items:center;gap:12px;padding:0 16px;height:50px;background:#CC0000;flex-shrink:0`})
  topBar.innerHTML = `
    <span class="bebas" style="font-size:26px;color:#FFD700;letter-spacing:3px">LABS BURGER</span>
    <span style="flex:1"></span>
    <span style="display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.2);padding:4px 10px;border-radius:20px">
      <span style="width:7px;height:7px;border-radius:50%;background:#86efac;display:inline-block"></span>Online
    </span>
    <span style="font-size:13px;color:rgba(255,255,255,.85);padding:4px 12px;background:rgba(0,0,0,.2);border-radius:20px">Demo Cashier</span>
    <span style="font-size:11px;color:rgba(255,255,255,.4);padding:3px 10px;background:rgba(0,0,0,.2);border-radius:20px">DEMO MODE</span>
  `
  app.appendChild(topBar)

  // Main area
  const main = el('div', {style:`display:flex;flex:1;overflow:hidden`})
  app.appendChild(main)

  // ── Category sidebar ──
  const sidebar = el('div', {style:`width:94px;background:#141414;display:flex;flex-direction:column;gap:4px;padding:8px;overflow-y:auto;flex-shrink:0`})
  CATEGORIES.forEach(cat => {
    const active = activeCategory === cat
    const btn = el('button', {
      onclick:`window._setCategory('${cat}')`,
      style:`padding:10px 6px;border-radius:8px;font-size:11px;font-weight:700;background:${active?'#CC0000':'#1e1e1e'};color:${active?'#fff':'#555'};border:none;text-align:center;line-height:1.3`
    })
    btn.textContent = cat
    sidebar.appendChild(btn)
  })
  main.appendChild(sidebar)

  // ── Product grid ──
  const grid = el('div', {style:`flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;align-content:start`})
  const filtered = activeCategory === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.category === activeCategory)
  filtered.forEach(p => {
    const isFlashing = flashProduct === p.id
    const unavail = !p.is_available
    const card = el('button', {
      onclick: unavail ? '' : `window._addProduct('${p.id}')`,
      style:`background:${isFlashing?'#3a0000':unavail?'#141414':'#1e1e1e'};border:1.5px solid ${unavail?'#1a1a1a':isFlashing?'#CC0000':'#2a2a2a'};border-radius:12px;padding:14px;text-align:left;color:${unavail?'#333':'#fff'};cursor:${unavail?'not-allowed':'pointer'};transition:all .1s;display:flex;flex-direction:column;gap:6px;min-height:96px;position:relative;overflow:hidden`
    })
    card.innerHTML = `
      ${p.is_combo ? '<span style="position:absolute;top:8px;right:8px;font-size:9px;background:#FFD700;color:#000;padding:2px 6px;border-radius:20px;font-weight:800;letter-spacing:.5px">COMBO</span>' : ''}
      <span style="font-size:14px;font-weight:600;line-height:1.3;padding-right:${p.is_combo?44:0}px">${p.name}</span>
      <span class="bebas" style="font-size:20px;color:${unavail?'#333':'#FFD700'};letter-spacing:1px">₱${p.price}</span>
      ${unavail ? '<span style="font-size:10px;color:#333;font-weight:700;text-transform:uppercase;letter-spacing:1px">Unavailable</span>' : ''}
    `
    grid.appendChild(card)
  })
  main.appendChild(grid)

  // ── Cart panel ──
  const cartPanel = el('div', {style:`width:314px;background:#141414;border-left:1px solid #1e1e1e;display:flex;flex-direction:column;flex-shrink:0`})

  // Cart header
  const cartHdr = el('div', {style:`padding:14px 16px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0`})
  cartHdr.innerHTML = `
    <span style="font-weight:700;font-size:15px">Order${getCount()>0?`<span style="margin-left:8px;background:#CC0000;color:#fff;border-radius:20px;font-size:11px;padding:2px 8px;font-weight:700">${getCount()}</span>`:''}  </span>
    ${cart.length > 0 ? `<button onclick="window._clearCart()" style="font-size:12px;color:#666;background:none;padding:4px 8px;border-radius:6px;border:1px solid #333">Clear</button>` : ''}
  `
  cartPanel.appendChild(cartHdr)

  // Cart items
  const cartItems = el('div', {style:`flex:1;overflow-y:auto;padding:8px 0`})
  if (cart.length === 0) {
    cartItems.innerHTML = `<div style="text-align:center;color:#333;padding-top:48px;font-size:13px"><div style="font-size:32px;margin-bottom:8px">🛒</div>Tap a product to add</div>`
  } else {
    cart.forEach(item => {
      const row = el('div', {style:`padding:10px 16px;border-bottom:1px solid #1f1f1f`})
      row.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px">
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <button onclick="window._changeQty('${item.id}',-1)" style="width:28px;height:28px;border-radius:8px;background:#2a2a2a;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center">−</button>
            <span style="font-size:15px;font-weight:700;min-width:20px;text-align:center">${item.qty}</span>
            <button onclick="window._changeQty('${item.id}',1)" style="width:28px;height:28px;border-radius:8px;background:#CC0000;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center">+</button>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.name}</div>
            <div style="font-size:12px;color:#FFD700">₱${(item.price * item.qty).toFixed(2)}</div>
          </div>
          <button onclick="window._changeQty('${item.id}',-99)" style="color:#444;background:none;font-size:16px;padding:4px">✕</button>
        </div>
      `
      cartItems.appendChild(row)
    })
  }
  cartPanel.appendChild(cartItems)

  // Cart footer
  const cartFoot = el('div', {style:`padding:16px;border-top:1px solid #2a2a2a;flex-shrink:0;background:#0f0f0f`})
  const total = getTotal()
  cartFoot.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:14px;align-items:baseline">
      <span style="font-size:14px;color:#555;font-weight:600;letter-spacing:1px">TOTAL</span>
      <span class="bebas" style="font-size:36px;color:#FFD700;letter-spacing:1px">₱${total.toFixed(2)}</span>
    </div>
    <button onclick="window._openPayment()" ${cart.length===0?'disabled':''} style="width:100%;height:58px;background:${cart.length>0?'#CC0000':'#1a1a1a'};color:${cart.length>0?'#fff':'#333'};border-radius:12px;font-size:16px;font-weight:800;letter-spacing:1.5px;transition:all .12s">
      CHARGE ${total > 0 ? '₱'+total.toFixed(2) : ''}
    </button>
  `
  cartPanel.appendChild(cartFoot)
  main.appendChild(cartPanel)

  // ── Payment Modal ──
  if (view === 'payment') renderPaymentModal(app, total)

  // ── Success Modal ──
  if (view === 'success') renderSuccessModal(app)
}

function renderPaymentModal(app, total) {
  const overlay = el('div', {style:`position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center`})
  const modal = el('div', {style:`background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;width:400px;max-height:92vh;overflow:auto;display:flex;flex-direction:column`})

  const amount = parseFloat(amountStr) || 0
  const change = payMethod === 'cash' ? Math.max(0, amount - total) : 0
  const canPay = payMethod === 'gcash' || amount >= total

  modal.innerHTML = `
    <!-- Header -->
    <div style="padding:20px 24px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="bebas" style="font-size:20px;letter-spacing:3px;color:#666">PAYMENT</div>
        <div class="bebas" style="font-size:46px;color:#FFD700;letter-spacing:2px;line-height:1">₱${total.toFixed(2)}</div>
      </div>
      <button onclick="window._closePayment()" style="background:none;color:#444;font-size:22px;padding:4px;margin-top:4px">✕</button>
    </div>

    <!-- Dining type -->
    <div style="display:flex;gap:8px;padding:14px 24px;border-bottom:1px solid #1e1e1e">
      <button onclick="window._setDining('dine_in')" style="flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;background:${diningType==='dine_in'?'#CC0000':'#252525'};color:${diningType==='dine_in'?'#fff':'#555'};border:1.5px solid ${diningType==='dine_in'?'#CC0000':'#2a2a2a'}">Dine In</button>
      <button onclick="window._setDining('takeout')" style="flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;background:${diningType==='takeout'?'#CC0000':'#252525'};color:${diningType==='takeout'?'#fff':'#555'};border:1.5px solid ${diningType==='takeout'?'#CC0000':'#2a2a2a'}">Takeout</button>
    </div>

    <!-- Method -->
    <div style="display:flex;gap:10px;padding:14px 24px;border-bottom:1px solid #1e1e1e">
      <button onclick="window._setMethod('cash')" style="flex:1;height:50px;font-size:16px;font-weight:700;background:${payMethod==='cash'?'#CC0000':'#252525'};color:${payMethod==='cash'?'#fff':'#555'};border:1.5px solid ${payMethod==='cash'?'#CC0000':'#2a2a2a'};border-radius:10px;letter-spacing:1px">CASH</button>
      <button onclick="window._setMethod('gcash')" style="flex:1;height:50px;font-size:16px;font-weight:700;background:${payMethod==='gcash'?'#CC0000':'#252525'};color:${payMethod==='gcash'?'#fff':'#555'};border:1.5px solid ${payMethod==='gcash'?'#CC0000':'#2a2a2a'};border-radius:10px;letter-spacing:1px">GCASH</button>
    </div>

    ${payMethod==='cash' ? `
    <!-- Cash input -->
    <div style="padding:16px 24px;border-bottom:1px solid #1e1e1e">
      <div style="background:#111;border:1px solid #252525;border-radius:10px;padding:10px 16px;text-align:right;margin-bottom:12px">
        <div style="font-size:11px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Amount tendered</div>
        <div class="bebas" style="font-size:40px;color:#fff;letter-spacing:2px">₱${amountStr||'0'}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px">
        ${[20,50,100,200,500,1000].map(v=>`<button onclick="window._quickCash(${v})" style="padding:8px 0;font-size:14px;font-weight:600;background:${v===amount?'#CC0000':'#252525'};color:${v===amount?'#fff':v>=total?'#ccc':'#444'};border:1px solid ${v===amount?'#CC0000':'#2a2a2a'};border-radius:8px">₱${v}</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${['7','8','9','4','5','6','1','2','3','←','0','.'].map(k=>`<button onclick="window._numpad('${k}')" style="height:50px;font-size:${k==='←'?18:22}px;font-weight:700;background:#1e1e1e;color:#fff;border:1px solid #2a2a2a;border-radius:10px">${k}</button>`).join('')}
      </div>
      ${amount>=total&&amount>0?`<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:10px"><span style="font-size:14px;font-weight:600;color:#22c55e">Change</span><span class="bebas" style="font-size:28px;color:#22c55e">₱${change.toFixed(2)}</span></div>`:''}
    </div>
    ` : `
    <!-- GCash -->
    <div style="padding:16px 24px;border-bottom:1px solid #1e1e1e">
      <div style="background:rgba(255,208,0,.06);border:1px solid rgba(255,208,0,.15);border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:#777;line-height:1.7">
        Ask the customer to scan the GCash QR code at the counter and send <strong style="color:#FFD700">₱${total.toFixed(2)}</strong>.
      </div>
      <input id="refNote" placeholder="Sender name (optional)" value="${refNote}" oninput="window._setRef(this.value)"
        style="width:100%;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:12px 16px;color:#ccc;font-size:14px"/>
    </div>
    `}

    <div style="padding:16px 24px">
      <button onclick="window._confirmPay()" ${canPay?'':'disabled'} style="width:100%;height:58px;font-size:18px;font-weight:800;background:${canPay?'#CC0000':'#1a1a1a'};color:${canPay?'#fff':'#333'};border-radius:12px;letter-spacing:2px">
        CONFIRM PAYMENT
      </button>
    </div>
  `
  overlay.appendChild(modal)
  app.appendChild(overlay)
}

function renderSuccessModal(app) {
  const overlay = el('div', {style:`position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center`})
  overlay.innerHTML = `
    <div style="background:#1a1a1a;border:1px solid rgba(34,197,94,.4);border-radius:20px;padding:40px;text-align:center;max-width:320px;width:90%">
      <div style="font-size:52px;margin-bottom:16px">✅</div>
      <div class="bebas" style="font-size:36px;color:#22c55e;letter-spacing:3px">ORDER PLACED</div>
      <div style="font-size:14px;color:#555;margin-top:6px">${lastOrder.number} · ${lastOrder.diningType==='dine_in'?'Dine In':'Takeout'}</div>
      ${lastOrder.method==='cash'&&lastOrder.change>0 ? `
        <div style="margin-top:20px">
          <div style="font-size:12px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Change</div>
          <div class="bebas" style="font-size:52px;color:#FFD700">₱${lastOrder.change.toFixed(2)}</div>
        </div>
      ` : lastOrder.method==='gcash' ? `
        <div style="margin-top:20px;padding:12px;background:rgba(103,232,249,.08);border:1px solid rgba(103,232,249,.2);border-radius:10px;font-size:13px;color:#67e8f9">GCash payment recorded</div>
      ` : ''}
      <div style="margin-top:12px;font-size:13px;color:#444">
        ${lastOrder.items.map(i=>`${i.qty}× ${i.name}`).join(' · ')}
      </div>
      <button onclick="window._newOrder()" style="margin-top:28px;width:100%;height:54px;background:#CC0000;color:#fff;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:1px">
        NEW ORDER
      </button>
    </div>
  `
  app.appendChild(overlay)
}

function el(tag, props={}) {
  const e = document.createElement(tag)
  Object.entries(props).forEach(([k,v]) => {
    if (k === 'onclick') e.onclick = new Function(v)
    else e.setAttribute(k, v)
  })
  return e
}

// Global handlers
window._setCategory = (cat) => { activeCategory = cat; render() }
window._addProduct = (id) => { const p = PRODUCTS.find(x=>x.id===id); if(p) addToCart(p) }
window._changeQty = (id, delta) => { changeQty(id, delta); render() }
window._clearCart = () => { clearCart() }
window._openPayment = () => { if(cart.length===0)return; view='payment'; amountStr=''; render() }
window._closePayment = () => { view='pos'; render() }
window._setMethod = (m) => { payMethod=m; amountStr=''; render() }
window._setDining = (d) => { diningType=d; render() }
window._numpad = (k) => { handleNumpad(k) }
window._quickCash = (v) => { amountStr=String(v); render() }
window._setRef = (v) => { refNote=v }
window._confirmPay = () => { const t=getTotal(); const a=parseFloat(amountStr||0); if(payMethod==='cash'&&a<t)return; confirmPayment() }
window._newOrder = () => { newOrder() }

render()
</script>
</body>
</html>
